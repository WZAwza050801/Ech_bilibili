<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="system-ui,'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>
  <text x="24" y="40" font-size="22" font-weight="bold" fill="#0f172a">详图 3 · 证据写作区块内部（对应总览 ⑦-⑨：逐窗口地图 → 大纲归组 → 公式复查）</text>
  <text x="24" y="64" font-size="13" fill="#64748b">脚本：writing.py(map_windows/outline/verify_formulas/quality_report)　外部 API：文本 /chat/completions · 视觉 /chat/completions（带图）</text>

  <!-- row 1 -->
  <g>
    <rect x="24" y="92" width="190" height="150" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-dasharray="5 3"/>
    <text x="40" y="118" font-size="13" font-weight="bold" fill="#065f46">区块输入</text>
    <text x="40" y="144" font-size="12" fill="#334155" font-family="Consolas,monospace">transcript.json</text>
    <text x="40" y="164" font-size="12" fill="#334155" font-family="Consolas,monospace">frames/ + sha256</text>
    <text x="40" y="184" font-size="12" fill="#334155" font-family="Consolas,monospace">alignment.json</text>
    <text x="40" y="212" font-size="11.5" fill="#64748b">600s 窗口，段/帧已对齐</text>
  </g>
  <line x1="214" y1="167" x2="244" y2="167" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <g>
    <rect x="248" y="92" width="460" height="150" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="264" y="118" font-size="15" font-weight="bold" fill="#4338ca">⑦ 逐窗口知识地图 map_windows</text>
    <rect x="264" y="130" width="180" height="22" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="274" y="145" font-size="11" fill="#334155" font-family="Consolas,monospace">writing.py · map_windows</text>
    <rect x="454" y="130" width="130" height="22" rx="5" fill="#fffbeb" stroke="#f59e0b"/><text x="464" y="145" font-size="11" fill="#b45309" font-family="Consolas,monospace">视觉 /chat/completions</text>
    <text x="264" y="176" font-size="12" fill="#334155">逐窗口调用：payload = 段文本 + 帧时间戳；图片一并上传</text>
    <text x="264" y="196" font-size="12" fill="#334155">有帧 → 视觉模型；纯口述窗口 → 文本模型（自动切换）</text>
    <text x="264" y="216" font-size="12" fill="#334155">产出知识块：kind/title/text/formulas/symbols/uncertainties</text>
    <text x="264" y="236" font-size="11.5" fill="#64748b">块 ID = w0007-b003，公式 ID = w0007-b003-eq001</text>
  </g>
  <line x1="708" y1="167" x2="738" y2="167" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <g>
    <rect x="742" y="92" width="514" height="150" rx="10" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="758" y="118" font-size="15" font-weight="bold" fill="#6d28d9">窗口级校验 + 重试 + 缓存</text>
    <text x="758" y="144" font-size="12" fill="#334155">validate_map：segment_ids / frame_ids 必须真实存在，</text>
    <text x="758" y="162" font-size="12" fill="#334155">编造 ID 直接整窗作废；uncertainties 字段强制保留</text>
    <text x="758" y="184" font-size="12" fill="#b91c1c">schema 缺字段 → retry_model 最多 3 次（退避 5s×n）</text>
    <text x="758" y="206" font-size="12" fill="#334155">cached() 键 = [提示词, 模型身份, payload, 帧sha256]</text>
    <text x="758" y="228" font-size="11.5" fill="#64748b">命中缓存 → cache/map-w00xx.json，重跑不重复付费</text>
  </g>

  <!-- row 2 -->
  <g>
    <rect x="24" y="272" width="600" height="150" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <text x="40" y="298" font-size="15" font-weight="bold" fill="#0369a1">⑧ 大纲归组 outline（有界 reduce）</text>
    <rect x="40" y="310" width="180" height="22" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="50" y="325" font-size="11" fill="#334155" font-family="Consolas,monospace">writing.py · outline</text>
    <rect x="230" y="310" width="130" height="22" rx="5" fill="#fffbeb" stroke="#f59e0b"/><text x="240" y="325" font-size="11" fill="#b45309" font-family="Consolas,monospace">文本 /chat/completions</text>
    <text x="40" y="356" font-size="12" fill="#334155">每 40 块一组做局部归组（长课程不撑爆上下文），摘要截断 800 字</text>
    <text x="40" y="376" font-size="12" fill="#334155">合并候选章节 → 终审 prompt 出最终大纲；所有 block_ids 逐一验证</text>
    <text x="40" y="396" font-size="12" fill="#b91c1c">出现"单块章节" → 修复 prompt 二次合并 → 仍是单块 → 显式报错</text>
    <text x="40" y="416" font-size="11.5" fill="#64748b">缓存：cache/reduce-00000.json … cache/reduce-final.json</text>
  </g>

  <g>
    <rect x="656" y="272" width="600" height="150" rx="10" fill="#fdf4ff" stroke="#c026d3" stroke-width="2"/>
    <text x="672" y="298" font-size="15" font-weight="bold" fill="#a21caf">⑨ 公式复查 verify_formulas（回看原图）</text>
    <rect x="672" y="310" width="200" height="22" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="682" y="325" font-size="11" fill="#334155" font-family="Consolas,monospace">writing.py · verify_formulas</text>
    <rect x="882" y="310" width="130" height="22" rx="5" fill="#fffbeb" stroke="#f59e0b"/><text x="892" y="325" font-size="11" fill="#b45309" font-family="Consolas,monospace">视觉 /chat/completions</text>
    <text x="672" y="356" font-size="12" fill="#334155">公式按 frame_id 分组；每帧把该帧全部 LaTeX 一并送回视觉模型</text>
    <text x="672" y="376" font-size="12" fill="#334155">核对板书原图，逐条给 status ∈ {match, mismatch, unclear} + note</text>
    <text x="672" y="396" font-size="12" fill="#334155">无帧来源的公式 → not_checked（如实标注，不冒充已核）</text>
    <text x="672" y="416" font-size="11.5" fill="#64748b">缓存：cache/verify-{frame_id}.json；响应条数/ID 集合不符即重试</text>
  </g>

  <!-- row 3 -->
  <g>
    <rect x="24" y="452" width="600" height="150" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="40" y="478" font-size="15" font-weight="bold" fill="#c2410c">质量台账 quality_report</text>
    <rect x="40" y="490" width="190" height="22" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="50" y="505" font-size="11" fill="#334155" font-family="Consolas,monospace">writing.py · quality_report</text>
    <text x="40" y="536" font-size="12" fill="#334155">status 恒为 needs_human_review（工具不自证正确）</text>
    <text x="40" y="556" font-size="12" fill="#334155">未引用段/帧清单 · uncertainties 汇总 · 符号冲突检测</text>
    <text x="40" y="576" font-size="12" fill="#334155">（同一符号两处含义不同 → 列入 symbol_conflicts）</text>
    <text x="40" y="596" font-size="11.5" fill="#64748b">polish_warnings · formula_checks · 块/公式计数</text>
  </g>
  <line x1="624" y1="527" x2="654" y2="527" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <g>
    <rect x="658" y="452" width="598" height="150" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-dasharray="5 3"/>
    <text x="674" y="478" font-size="13" font-weight="bold" fill="#065f46">区块产物（robotics 实跑数字）</text>
    <text x="674" y="504" font-size="12" fill="#334155" font-family="Consolas,monospace">cache/map-w0000.json … (逐窗口)</text>
    <text x="674" y="524" font-size="12" fill="#334155" font-family="Consolas,monospace">blocks.json — 185 个知识块 / 277 条公式</text>
    <text x="674" y="544" font-size="12" fill="#334155" font-family="Consolas,monospace">quality.json — 274 match · 3 unclear · 待人工复核</text>
    <text x="674" y="570" font-size="11.5" fill="#64748b">所有证据 ID 可回溯到 transcript.json 段与 frames/ 图片</text>
  </g>
</svg>
