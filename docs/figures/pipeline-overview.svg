    <text x="40" y="152" font-size="12.5" fill="#334155">B 站链接/BV号 → 元信息 + DASH 音视频</text>
    <rect x="40" y="166" width="150" height="22" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="50" y="181" font-size="11" fill="#334155" font-family="Consolas,monospace">media.py · Bilibili</text>
    <rect x="40" y="194" width="120" height="22" rx="5" fill="#fef3c7" stroke="#f59e0b"/><text x="50" y="209" font-size="11" fill="#92400e" font-family="Consolas,monospace">API playurl</text>
    <text x="40" y="243" font-size="11.5" fill="#64748b">产物：meta.json · source.mp4</text>
  </g>
  <line x1="304" y1="181" x2="334" y2="181" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <g>
    <rect x="338" y="96" width="280" height="170" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <rect x="338" y="96" width="280" height="34" rx="10" fill="#0d9488"/>
