    <text x="668" y="152" font-size="12.5" fill="#334155">每 10 分钟一块，防整段 STFT 溢出内存</text>
    <rect x="668" y="166" width="130" height="22" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="678" y="181" font-size="11" fill="#334155" font-family="Consolas,monospace">asr.py</text>
    <rect x="668" y="194" width="200" height="22" rx="5" fill="#f1f5f9" stroke="#94a3b8"/><text x="678" y="209" font-size="11" fill="#334155" font-family="Consolas,monospace">faster-whisper small/int8</text>
    <text x="668" y="243" font-size="11.5" fill="#64748b">产物：asr-output.json（2135 段）</text>
  </g>
  <line x1="932" y1="181" x2="962" y2="181" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <g>
    <rect x="966" y="96" width="280" height="170" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
