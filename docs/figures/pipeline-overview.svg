  </defs>
  <rect width="1280" height="790" fill="#ffffff"/>
  <text x="24" y="40" font-size="22" font-weight="bold" fill="#0f172a">EchoNotes · 课程视频 → 可查证 LaTeX 讲义 · 全项目流程总览</text>
  <text x="24" y="64" font-size="13" fill="#64748b">每个阶段的脚本、外部 API 与产物；分区内部细节见分区详图 1-5</text>

  <!-- Row 1 -->
  <g>
    <rect x="24" y="96" width="280" height="170" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
