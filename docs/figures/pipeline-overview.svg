    <text x="354" y="152" font-size="12.5" fill="#334155">提取音轨 → 16kHz 单声道 wav</text>
    <rect x="354" y="166" width="180" height="22" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="364" y="181" font-size="11" fill="#334155" font-family="Consolas,monospace">media.py · make_wav</text>
    <rect x="354" y="194" width="150" height="22" rx="5" fill="#f1f5f9" stroke="#94a3b8"/><text x="364" y="209" font-size="11" fill="#334155" font-family="Consolas,monospace">ffmpeg 本地</text>
    <text x="354" y="243" font-size="11.5" fill="#64748b">产物：audio.wav（252MB）</text>
  </g>
  <line x1="618" y1="181" x2="648" y2="181" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <g>
    <rect x="652" y="96" width="280" height="170" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
