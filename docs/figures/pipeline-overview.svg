    <rect x="982" y="166" width="150" height="22" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="992" y="181" font-size="11" fill="#334155" font-family="Consolas,monospace">writing.py · polish</text>
    <rect x="982" y="194" width="210" height="22" rx="5" fill="#fef3c7" stroke="#f59e0b"/><text x="992" y="209" font-size="11" fill="#92400e" font-family="Consolas,monospace">API text /chat/completions</text>
    <text x="982" y="243" font-size="11.5" fill="#64748b">产物：transcript.json</text>
  </g>

  <!-- elbow row1 -> row2 -->
  <path d="M 1106 266 L 1106 300 L 164 300 L 164 330" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

