    <rect x="668" y="404" width="170" height="22" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="678" y="419" font-size="11" fill="#334155" font-family="Consolas,monospace">writing.py · map_windows</text>
    <rect x="668" y="432" width="220" height="22" rx="5" fill="#fef3c7" stroke="#f59e0b"/><text x="678" y="447" font-size="11" fill="#92400e" font-family="Consolas,monospace">API vision /chat/completions</text>
    <text x="668" y="480" font-size="11.5" fill="#64748b">产物：map-w00xx.json（44 窗缓存）</text>
  </g>
  <line x1="932" y1="419" x2="962" y2="419" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <g>
    <rect x="966" y="334" width="280" height="170" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
