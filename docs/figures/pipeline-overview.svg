    <text x="354" y="390" font-size="12.5" fill="#334155">600 秒窗口；每窗最多 8 张候选帧</text>
    <rect x="354" y="404" width="160" height="22" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="364" y="419" font-size="11" fill="#334155" font-family="Consolas,monospace">core.py · align_windows</text>
